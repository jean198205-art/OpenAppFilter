name: build-oaf
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/build-oaf.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout oaf-6.1 branch
        uses: actions/checkout@v4
        with:
          ref: oaf-6.1

      - name: Install build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential clang flex bison g++ gawk \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file zstd

      - name: Download OpenWrt 24.10.0 SDK (qualcommax/ipq807x, kernel 6.6.73)
        run: |
          wget -q "https://downloads.openwrt.org/releases/24.10.0/targets/qualcommax/ipq807x/openwrt-sdk-24.10.0-qualcommax-ipq807x_gcc-13.3.0_musl.Linux-x86_64.tar.zst"
          tar --zstd -xf openwrt-sdk-*.tar.zst && rm -f openwrt-sdk-*.tar.zst
          mv openwrt-sdk-* sdk

      - name: Prepare feeds and packages
        run: |
          cd sdk
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ln -s "$GITHUB_WORKSPACE/oaf" package/oaf
          ln -s "$GITHUB_WORKSPACE/luci-app-oaf" package/luci-app-oaf

      - name: Build oaf kernel module
        run: |
          cd sdk
          make package/oaf/compile -j"$(nproc)" V=s || make package/oaf/compile V=s

      - name: Build luci-app-oaf
        run: |
          cd sdk
          make package/luci-app-oaf/compile -j"$(nproc)" V=s || make package/luci-app-oaf/compile V=s

      - name: Collect ipk packages
        run: |
          mkdir -p out
          find sdk/bin -name '*oaf*.ipk' -exec cp {} out/ \;
          ls -la out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oaf-ipks
          path: out/
